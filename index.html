})();

    startScreen.addEventListener('click', () => {
      bgMusic.play().then(() => {
        eqToggle.classList.remove('paused');
      }).catch(() => {});
      startScreen.classList.add('hidden');
    });

    eqToggle.addEventListener('click', togglePlayState);

    volumeSlider.addEventListener('input', (e) => {
      bgMusic.volume = e.target.value;
    });

    // --- Interactive 3D Card Tilt & Specular Lighting Effect ---
    const card = document.getElementById('profileCard');
    
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      card.style.setProperty('--mouse-x', `${x}px`);
      card.style.setProperty('--mouse-y', `${y}px`);

      const xAxis = (window.innerWidth / 2 - e.pageX) / 25;
      const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
      card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = `rotateY(0deg) rotateX(0deg)`;
      card.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
    });

    document.addEventListener('mouseenter', () => {
      card.style.transition = 'none';
    });

    // --- Advanced Interactive Particle Engine with Mouse Wind Deflection ---
    const canvas = document.getElementById('fx');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let mouseX = -1000;
    let mouseY = -1000;
    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    const particles = Array.from({ length: 95 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 2.3 + 0.6,
      vy: Math.random() * 0.7 + 0.2,
      vx: (Math.random() - 0.5) * 0.4,
      o: Math.random() * 0.75 + 0.15
    }));

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        const dx = mouseX - p.x;
        const dy = mouseY - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 140) {
          const angle = Math.atan2(dy, dx);
          p.x -= Math.cos(angle) * 2;
          p.y -= Math.sin(angle) * 2;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.o})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
        ctx.shadowBlur = 0;

        p.y += p.vy;
        p.x += p.vx;

        if (p.y > canvas.height + 10) { p.y = -10; p.x = Math.random() * canvas.width; }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    // --- Real-Time Concurrent Lanyard Integration ---
    const DISCORD_ID = '1535329294350553170';
    const statusDot = document.getElementById('statusDot');
    const userAvatar = document.getElementById('userAvatar');
    const userName = document.getElementById('userName');
    const userTag = document.getElementById('userTag');
    const customStatus = document.getElementById('customStatus');
    
    const spotifyBox = document.getElementById('spotifyBox');
    const spotifyMediaContainer = document.getElementById('spotifyMediaContainer');
    const spotifyTitle = document.getElementById('spotifyTitle');
    const spotifySub = document.getElementById('spotifySub');

    const codingBox = document.getElementById('codingBox');
    const codingMediaContainer = document.getElementById('codingMediaContainer');
    const codingTypeLabel = document.getElementById('codingTypeLabel');
    const codingTitle = document.getElementById('codingTitle');
    const codingSub = document.getElementById('codingSub');

    const STATUS_COLORS = {
      online: 'var(--online)',
      idle: 'var(--idle)',
      dnd: 'var(--dnd)',
      offline: 'var(--offline)'
    };

    function updateProfileUI(data) {
      if (!data) return;

      const currentStatus = data.discord_status || 'offline';
      statusDot.style.backgroundColor = STATUS_COLORS[currentStatus] || STATUS_COLORS.offline;

      if (data.discord_user) {
        if (data.discord_user.avatar) {
          userAvatar.src = `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${data.discord_user.avatar}.png?size=256`;
        }
        if (data.discord_user.username) {
          userName.textContent = data.discord_user.global_name || data.discord_user.username;
          userTag.textContent = `@${data.discord_user.username}`;
        }
      }

      // Custom Status Handling
      const customActivity = data.activities ? data.activities.find(a => a.type === 4) : null;
      if (customActivity && (customActivity.state || customActivity.details)) {
        let statusContent = '';
        if (customActivity.emoji) {
          if (customActivity.emoji.id) {
            const ext = customActivity.emoji.animated ? 'gif' : 'png';
            statusContent += `<img src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.${ext}?size=24" style="width:14px;height:14px;object-fit:contain;vertical-align:middle;"> `;
          } else if (customActivity.emoji.name) {
            statusContent += `${customActivity.emoji.name} `;
          }
        }
        statusContent += customActivity.state || customActivity.details || '';
        customStatus.innerHTML = statusContent;
        customStatus.classList.add('visible');
      } else {
        customStatus.classList.remove('visible');
      }

      // Spotify Module Update
      if (data.spotify) {
        spotifyBox.classList.add('visible');
        if (data.spotify.album_art_url) {
          spotifyMediaContainer.innerHTML = `<img class="activity-art" src="${data.spotify.album_art_url}" alt="Album Art">`;
        }
        spotifyTitle.textContent = data.spotify.song;
        spotifySub.textContent = `by ${data.spotify.artist}`;
      } else {
        spotifyBox.classList.remove('visible');
      }

      // Activity Module Update
      const activeApp = data.activities ? data.activities.find(a => a.type !== 4 && a.name !== 'Spotify') : null;
      
      if (activeApp) {
        codingBox.classList.add('visible');
        
        let typeText = 'Active Task';
        if (activeApp.type === 0) typeText = 'Playing Game';
        else if (activeApp.type === 1) typeText = 'Streaming';
        else if (activeApp.type === 3) typeText = 'Watching';
        
        codingTypeLabel.textContent = typeText;
        codingTitle.textContent = activeApp.name;
        codingSub.textContent = activeApp.details || activeApp.state || 'Active';

        let iconHTML = `<div class="activity-icon-fallback"><svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg></div>`;

        if (activeApp.assets && activeApp.assets.large_image) {
          let imgId = activeApp.assets.large_image;
          if (imgId.startsWith('mp:')) {
            imgId = imgId.replace('mp:', 'https://media.discordapp.net/');
          } else {
            imgId = `https://cdn.discordapp.com/app-assets/${activeApp.application_id}/${imgId}.png`;
          }
          iconHTML = `<img class="activity-art" src="${imgId}" alt="App Icon">`;
        }
        codingMediaContainer.innerHTML = iconHTML;
      } else {
        codingBox.classList.remove('visible');
      }
    }

    async function fetchLanyardREST() {
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
        const result = await response.json();
        if (result.success) {
          updateProfileUI(result.data);
        }
      } catch (err) {
        console.error('Lanyard REST Error:', err);
      }
    }
    fetchLanyardREST();

    function connectLanyardWS() {
      let heartbeatInterval = null;
      const socket = new WebSocket('wss://api.lanyard.rest/socket');

      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        
        if (message.op === 1) {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ op: 3 }));
            }
          }, message.d.heartbeat_interval);

          socket.send(JSON.stringify({
            op: 2,
            d: { subscribe_to_id: DISCORD_ID }
          }));
        }

        if (message.op === 0 && message.d) {
          updateProfileUI(message.d);
        }
      };

      socket.onclose = () => {
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        setTimeout(connectLanyardWS, 5000);
      };
    }

    connectLanyardWS();
  </script>
</body>
